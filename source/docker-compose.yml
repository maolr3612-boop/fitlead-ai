services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fitlead
      POSTGRES_USER: fitlead
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitlead_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitlead"]
      interval: 5s
      retries: 10
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://fitlead:${POSTGRES_PASSWORD:-fitlead_local}@db:5432/fitlead
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      CONTACT_ENCRYPTION_KEY: ${CONTACT_ENCRYPTION_KEY:?Set CONTACT_ENCRYPTION_KEY in .env}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ENVIRONMENT: development
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  pgdata:
